# ── Backend Service ───────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: sms-backend-service
  namespace: sms
  labels:
    app: sms-backend
    component: api
spec:
  type: ClusterIP
  selector:
    app: sms-backend
    component: api
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
# ── Frontend Service ──────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: sms-frontend-service
  namespace: sms
  labels:
    app: sms-frontend
    component: web
spec:
  type: NodePort
  selector:
    app: sms-frontend
    component: web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30080
