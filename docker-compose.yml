# Smart Student Management System — local run with Docker Engine / Compose
# From this folder: docker compose up --build
# UI: http://localhost:3001  |  API: http://localhost:5000/api
# (Host port 3001 avoids conflict with local "npm start" on 3000)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: frontend
        EXPOSE_PORT: "3000"
    container_name: sms-frontend
    ports:
      - "3001:3000"
    restart: unless-stopped
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: backend
        EXPOSE_PORT: "5000"
    container_name: sms-backend
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
    restart: unless-stopped
